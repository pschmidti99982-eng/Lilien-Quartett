<style>
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one phone-sized column; the player's own card dominates, the last duel sits above it as a compact strip. */
:root {
  --bg: #eef2f8;
  --surface: #ffffff;
  --fg: #0d1b2e;
  --muted: #56657a;
  --line: #d3dbe7;
  --lilie: #0057a8;       /* Darmstadt blue */
  --lilie-ink: #ffffff;
  --gold: #c9a23a;
  --win: #1d7a46;
  --lose: #b23a3a;
  --font-display: "Saira Condensed", "Arial Narrow", sans-serif;
  --font-body: "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1320; --surface: #142033; --fg: #e8eef7; --muted: #9aa9bf; --line: #24344d;
  --lilie: #3d8de0; --lilie-ink: #06101d; --gold: #e0bd5a; --win: #4cc283; --lose: #ee7b7b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1320; --surface: #142033; --fg: #e8eef7; --muted: #9aa9bf; --line: #24344d;
  --lilie: #3d8de0; --lilie-ink: #06101d; --gold: #e0bd5a; --win: #4cc283; --lose: #ee7b7b; color-scheme: dark }

html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 460px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: .01em; margin: 0; text-transform: uppercase; line-height: 1; }
h1 span { color: var(--lilie); }
.small { font-size: 13px; color: var(--muted); }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 0; text-transform: uppercase; letter-spacing: .03em; text-wrap: balance; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.score .who { display: flex; flex-direction: column; min-width: 0; }
.score .who:last-child { text-align: right; }
.score .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .n { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.score .vs { font-family: var(--font-display); color: var(--muted); font-size: 14px; text-transform: uppercase; }
.turnpill { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--lilie); color: var(--lilie-ink); }

/* Quartett card */
.card { background: var(--surface); border: 2px solid var(--lilie); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.card .top { background: var(--lilie); color: var(--lilie-ink); padding: 12px 14px 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; }
.card .code { grid-row: span 2; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; border: 2px solid currentColor; border-radius: 8px; padding: 4px 8px; font-variant-numeric: tabular-nums; }
.card .name { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.05; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.card .meta { font-size: 13px; opacity: .9; }
.card .era { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 11px; }
.card .art { height: 64px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); color: var(--lilie); }
.card .art svg { height: 46px; width: auto; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 16px; background: transparent; color: var(--fg); border-left: 0; border-right: 0; border-bottom: 0; text-align: left; font-family: inherit; width: 100%; }
.row:first-child { border-top: 0; }
.row .v { font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
button.row { cursor: pointer; }
button.row:hover { background: color-mix(in srgb, var(--lilie) 10%, transparent); }
button.row:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
button.row::after { content: ""; }
.row.chosen { background: color-mix(in srgb, var(--gold) 22%, transparent); }
.card .foot { padding: 8px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }

.hint { text-align: center; font-weight: 600; }
.hint.go { color: var(--lilie); }

/* duel strip */
.duel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mini.w { border-color: var(--win); box-shadow: inset 0 0 0 1px var(--win); }
.mini .who { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.mini .pn { font-weight: 700; overflow-wrap: anywhere; }
.mini .pv { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.result { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-transform: uppercase; }
.result.w { color: var(--win); } .result.l { color: var(--lose); }

.btn { font: 700 16px/1 var(--font-body); padding: 13px 16px; border-radius: 10px; border: 0; background: var(--lilie); color: var(--lilie-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 auto; }
input[type=text] { font: 16px var(--font-body); padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seat { border: 1px dashed var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.seat.taken { border-style: solid; border-color: var(--lilie); }
.seat .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.seat .nm { font-weight: 700; overflow-wrap: anywhere; }
.err { color: var(--lose); font-weight: 600; }
.confirm { display: flex; flex-direction: column; gap: 8px; }
.trophy { font-family: var(--font-display); font-weight: 800; font-size: 34px; text-transform: uppercase; color: var(--lilie); line-height: 1.05; text-wrap: balance; }
@media (prefers-reduced-motion: no-preference) {
  .flip { animation: flip .35s ease-out; }
  @keyframes flip { from { transform: rotateY(70deg); opacity: .3 } to { transform: none; opacity: 1 } }
}

async function takeSeat(seat) {

async function startGame() {

  s.pot = []; s.last = null; s.round = 0; s.winner = null; s.status = "play";
  s.turn = Math.random() < .5 ? "A" : "B";
  await save(s);

async function choose(key) {
  if (busy) return;
  const s = clone(state); const seat = mySeat(s);
  if (s.status !== "play" || s.turn !== seat) return;
  const a = s.hands.A.shift(), b = s.hands.B.shift();
  const va = CARDS[a][key], vb = CARDS[b][key];
  const winner = va > vb ? "A" : vb > va ? "B" : "tie";
  const won = [a, b];
  if (winner === "tie") { s.pot = s.pot.concat(won); }
  else { s.hands[winner] = s.hands[winner].concat(won, s.pot); s.pot = []; s.turn = winner; }
  s.round += 1;
  s.last = { by: seat, attr: key, A: a, B: b, winner, round: s.round };
  if (!s.hands.A.length || !s.hands.B.length) {
    s.status = "over";
    s.winner = s.hands.A.length > s.hands.B.length ? "A" : s.hands.B.length > s.hands.A.length ? "B" : "tie";
  }
  await save(s);
}

  const c = CARDS[idx];
  const rows = ATTRS.map(at => {
    const kids = [el("span", {}, at.label), el("span", { class: "v" }, at.fmt(c[at.key], c))];
    const cls = "row" + (opts.chosen === at.key ? " chosen" : "");
    return opts.pick ? el("button", { class: cls, type: "button", onclick: () => choose(at.key), disabled: busy }, kids) : el("div", { class: cls }, kids);
  });
  return el("article", { class: "card" + (opts.flip ? " flip" : ""), "aria-label": "Karte " + c.code + " " + c.name },
    el("div", { class: "top" },
      el("div", { class: "code" }, c.code),
      el("div", { class: "name" }, c.name),
      el("div", { class: "meta" }, el("span", { class: "era" }, c.aera), " · " + c.pos + " · Jg. " + c.jg)),
    el("div", { class: "art", html: LILY }),
    el("div", { class: "rows" }, rows));
}

function scoreBar(s, seat) {
  const mk = sd => el("div", { class: "who" },
    el("span", { class: "nm" }, seatName(s, sd) + (seat === sd ? " (du)" : "")),
    el("span", { class: "n" }, s.hands[sd].length),
    s.status === "play" && s.turn === sd ? el("span", {}, el("span", { class: "turnpill" }, "am Zug")) : el("span", { class: "small" }, "Karten"));
  return el("div", { class: "panel" },
    el("div", { class: "score" }, mk("A"), el("span", { class: "vs" }, s.pot.length ? "Topf " + s.pot.length : "gegen"), mk("B")));
}

function duelView(s, seat) {
  const L = s.last; if (!L) return null;
  const at = ATTRS.find(a => a.key === L.attr);
  const mini = sd => { const c = CARDS[L[sd]]; return el("div", { class: "mini" + (L.winner === sd ? " w" : "") },
    el("span", { class: "who" }, seatName(s, sd)), el("span", { class: "pn" }, c.code + " " + c.name), el("span", { class: "pv" }, at.fmt(c[L.attr], c))); };
  let text, cls = "result";
  if (L.winner === "tie") text = "Gleichstand, Karten gehen in den Topf";
  else if (!seat) text = seatName(s, L.winner) + " gewinnt den Stich";
  else if (L.winner === seat) { text = "Stich für dich"; cls += " w"; }
  else { text = "Stich für " + seatName(s, L.winner); cls += " l"; }
  return el("section", { class: "panel" },
    el("span", { class: "small" }, "Runde " + L.round + " · " + seatName(s, L.by) + " wählte " + at.label),
    el("div", { class: "duel" }, mini("A"), mini("B")),
    el("span", { class: cls }, text));
}

function lobbyView(s) {
  const seat = mySeat(s);
  const seatBox = sd => {
    const t = s.seats && s.seats[sd];
    return el("div", { class: "seat" + (t ? " taken" : "") },
      el("div", { class: "lbl" }, sd === "A" ? "Platz 1" : "Platz 2"),
      t ? el("div", { class: "nm" }, t.name + (t.id === me ? " (du)" : "")) :
        el("button", { class: "btn", type: "button", onclick: () => takeSeat(sd), disabled: busy, style: "margin-top:6px;width:100%" }, "Hier hinsetzen"));
  };
  const both = s.seats && s.seats.A && s.seats.B;
  return el("section", { class: "panel" },
    el("h2", {}, both ? "Alle da. Anpfiff?" : "Wer spielt mit?"),
    !seat ? el("div", {}, el("label", { for: "name", class: "small" }, "Dein Name"),
      el("input", { id: "name", type: "text", maxlength: "24", placeholder: "z. B. Philipp", value: draftName, oninput: e => { draftName = e.target.value; } })) : null,
    el("div", { class: "seats" }, seatBox("A"), seatBox("B")),
    both && seat ? el("button", { class: "btn", type: "button", onclick: startGame, disabled: busy }, "Karten austeilen") : null,
    !both ? el("p", { class: "small", style: "margin:0" }, "Schick deinem Bruder denselben Link. Sobald beide sitzen, teilt einer von euch die 32 Karten aus.") : null);
}

function footerControls(s) {
  if (!mySeat(s)) return null;
  if (confirmReset) return el("div", { class: "panel confirm" },
    el("strong", {}, "Spiel wirklich abbrechen? Alle Karten werden neu gemischt."),
    el("div", { class: "btns" },
      el("button", { class: "btn", type: "button", onclick: () => resetGame(true) }, "Ja, neu mischen"),
      el("button", { class: "btn ghost", type: "button", onclick: () => { confirmReset = false; render(); } }, "Weiterspielen")));
  return el("div", { class: "btns" },
    el("button", { class: "btn ghost", type: "button", onclick: () => { confirmReset = true; render(); } }, "Spiel abbrechen"));
}

let lastRoundShown = -1;
function render() {
  const s = state || blankState();
  const seat = mySeat(s);
  const kids = [];
  if (err) kids.push(el("p", { class: "err", role: "alert", style: "margin:0" }, err));
  if (s.status === "lobby") {
    kids.push(lobbyView(s));
  } else {
    kids.push(scoreBar(s, seat));
    if (s.status === "over") {
      const txt = s.winner === "tie" ? "Unentschieden" : (seat && s.winner === seat ? "Du hast gewonnen!" : seatName(s, s.winner) + " hat gewonnen");
      kids.push(el("section", { class: "panel" }, el("div", { class: "trophy" }, txt),
        el("span", { class: "small" }, "Nach " + s.round + " Runden."),
        seat ? el("div", { class: "btns" },
          el("button", { class: "btn", type: "button", onclick: startGame, disabled: busy }, "Revanche"),
          el("button", { class: "btn ghost", type: "button", onclick: () => resetGame(false), disabled: busy }, "Plätze freigeben")) : null));
      const d = duelView(s, seat); if (d) kids.push(d);
    } else {
      const d = duelView(s, seat); if (d) kids.push(d);
      if (seat) {
        const mine = s.hands[seat][0];
        const myTurn = s.turn === seat;
        kids.push(el("p", { class: "hint" + (myTurn ? " go" : ""), style: "margin:0" },
          myTurn ? "Du bist dran: tippe auf den Wert, mit dem du stechen willst." : seatName(s, other(seat)) + " wählt gerade einen Wert …"));
        const flip = s.round !== lastRoundShown;
        kids.push(cardView(mine, { pick: myTurn && !busy, flip }));
        lastRoundShown = s.round;
        kids.push(el("p", { class: "small", style: "margin:0;text-align:center" }, "Deine oberste Karte. Darunter liegen noch " + (s.hands[seat].length - 1) + "."));
      } else {
        kids.push(el("p", { class: "small" }, "Hier spielen gerade " + seatName(s, "A") + " und " + seatName(s, "B") + ". Du schaust zu."));
      }
      kids.push(footerControls(s));
    }
  }
  const focusedName = document.activeElement && document.activeElement.id === "name";
  app.replaceChildren(...kids.filter(Boolean));
  if (focusedName) { const n = document.getElementById("name"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
}

function offline(msg) {
  app.replaceChildren(el("section", { class: "panel" }, el("h2", {}, "Keine Verbindung zum Spiel"), el("p", { style: "margin:0" }, msg)),
    el("h2", {}, "Vorschau einer Karte"), cardView(0));
}

function myId() {
  let id = null;
  try { id = localStorage.getItem("lq-id"); if (!id) { id = "p" + Math.random().toString(36).slice(2, 12); localStorage.setItem("lq-id", id); } }
  catch (e) { id = "p" + Math.random().toString(36).slice(2, 12); }
  return id;
}

function boot() {
  render();
  if (!window.firebase) { offline("Die Seite konnte nicht geladen werden. Prüfe die Internetverbindung und lade neu."); return; }
  firebase.initializeApp(firebaseConfig);
  me = myId();
  ref = firebase.database().ref(GAME);
  ref.on("value", snap => { state = normalize(snap.val()); render(); },
    e => offline("Die Datenbank hat den Zugriff verweigert. Prüfe die Regeln in Firebase."));
}
boot();
</script>
</body>
</html>
